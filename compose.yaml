name: itos

services:
  api:
    image: itos-api:local
    build:
      context: ./backend
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      MODEL_NAME: ${MODEL_NAME:-muse-spark-1.3}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.7}
      MODEL_SECRET_NAME: ${MODEL_SECRET_NAME:-dev/AppAlpha/secrets}
      MODEL_SECRET_KEY: ${MODEL_SECRET_KEY:-Muse_API_KEY_TEST}
      MODEL_FALLBACK_NAME: ${MODEL_FALLBACK_NAME:-}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-50}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-50}
      AGENT_MAX_TOOL_FAILURES: ${AGENT_MAX_TOOL_FAILURES:-3}
      AGENT_MODEL_RETRIES: ${AGENT_MODEL_RETRIES:-2}
      ASSEMBLYAI_SECRET_NAME: ${ASSEMBLYAI_SECRET_NAME:-dev/AppAlpha/secrets}
      ASSEMBLYAI_SECRET_KEY: ${ASSEMBLYAI_SECRET_KEY:-ASSEMBLYAI_API_KEY}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - itos-data:/app/data
      - itos-projects:/app/projects
    expose:
      - "8000"
    stop_grace_period: 30s

  web:
    image: itos-web:local
    build:
      context: ./frontend
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  api-tests:
    image: itos-api-tests:local
    build:
      context: ./backend
      target: test
    profiles: [test]
    init: true

volumes:
  itos-data:
  itos-projects:
